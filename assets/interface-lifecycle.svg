<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="260" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="#173b51"/><text x="40" y="42" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="14" letter-spacing="2.6">LEVIATHAN API // INTERFACE LIFECYCLE</text><text x="40" y="64" fill="#7899ac" font-family="Segoe UI,Arial" font-size="11">Public contracts move from planning to validation before they are intentionally published and versioned.</text><path id="p" d="M100 150 H1100" fill="none" stroke="#165d79" stroke-width="3"/><circle r="5" fill="#67f2ff" filter="url(#g)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(120 150)"><circle r="34" fill="#061722" stroke="#4c6473"/><text y="5" fill="#eefcff" font-size="12">PLANNED</text></g><g transform="translate(340 150)"><circle r="38" fill="#061722" stroke="#22bddb"/><text y="0" fill="#eefcff" font-size="11">DOCUMENTED</text><text y="16" fill="#7898aa" font-size="9">development</text></g><g transform="translate(570 150)"><circle r="34" fill="#061722" stroke="#35e8f8"/><text y="5" fill="#eefcff" font-size="12">VALIDATED</text></g><g transform="translate(800 150)"><circle r="38" fill="#061722" stroke="#8174ff"/><text y="0" fill="#eefcff" font-size="11">PUBLISHED</text><text y="16" fill="#7898aa" font-size="9">intentional</text></g><g transform="translate(1040 150)"><circle r="38" fill="#061722" stroke="#43d9a3"/><text y="0" fill="#eefcff" font-size="11">VERSIONED</text><text y="16" fill="#7898aa" font-size="9">maintained</text></g></g><text x="600" y="224" text-anchor="middle" fill="#66899c" font-family="ui-monospace,Consolas,monospace" font-size="9">DEVELOPMENT-STAGE INTERFACES ARE NOT REPRESENTED AS LIVE PRODUCTION ENDPOINTS</text></svg>