<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><linearGradient id="b"><stop stop-color="#020914"/><stop offset="1" stop-color="#061827"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="390" rx="24" fill="url(#b)"/><rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#17394d"/><text x="50" y="48" fill="#4deaff" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="3">LEVIATHAN API DOCS // CONTRACT MODEL</text><text x="50" y="77" fill="#809eae" font-family="Segoe UI,Arial,sans-serif" font-size="15">Every supported public interface is documented as a request, response and event contract.</text><g font-family="Segoe UI,Arial,sans-serif"><g transform="translate(80 125)"><rect width="300" height="155" rx="18" fill="#061a28" stroke="#1b5369"/><text x="150" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">REQUEST CONTRACT</text><text x="150" y="78" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">INPUT BOUNDARY</text><text x="150" y="108" text-anchor="middle" fill="#789cad" font-size="11">auth • params • pagination • version</text></g><g transform="translate(450 125)"><rect width="300" height="155" rx="18" fill="#061a28" stroke="#1b5369"/><text x="150" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">RESPONSE CONTRACT</text><text x="150" y="78" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">OUTPUT BOUNDARY</text><text x="150" y="108" text-anchor="middle" fill="#789cad" font-size="11">models • errors • rate limits • compat</text></g><g transform="translate(820 125)"><rect width="300" height="155" rx="18" fill="#061a28" stroke="#1b5369"/><text x="150" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">EVENT CONTRACT</text><text x="150" y="78" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">ASYNC BOUNDARY</text><text x="150" y="108" text-anchor="middle" fill="#789cad" font-size="11">webhooks • payloads • verification</text></g></g><path id="p" d="M380 202H450M750 202H820" stroke="#28677f" stroke-width="3"/><circle r="5" fill="#76f5ff" filter="url(#g)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><text x="80" y="330" fill="#6d94a8" font-family="ui-monospace,Consolas,monospace" font-size="10">READING PATH // AUTHENTICATION → ENDPOINTS → VERSIONING → RATE LIMITS → ERRORS → WEBHOOKS → SDK → SECURITY</text><text x="80" y="355" fill="#6d94a8" font-family="ui-monospace,Consolas,monospace" font-size="10">ONLY INTENTIONALLY PUBLIC INTERFACES ARE DOCUMENTED AS AVAILABLE</text></svg>