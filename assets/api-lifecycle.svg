<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#173b51"/><text x="42" y="44" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN API // INTERFACE LIFECYCLE</text><text x="42" y="68" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">Only interfaces that pass documentation, validation and release gates become supported public contracts.</text><path id="p" d="M120 210 H1080" fill="none" stroke="#174c66" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#63f2ff" filter="url(#g)"><animateMotion dur="7.5s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><circle cx="150" cy="210" r="48" fill="#071a26" stroke="#5a7181" stroke-width="2"/><text x="150" y="205" fill="#eefcff" font-size="14" font-weight="750">PLANNED</text><text x="150" y="224" fill="#7f9fb0" font-size="9">directional</text></g><g><circle cx="375" cy="210" r="48" fill="#071a26" stroke="#20bfdd" stroke-width="2"/><text x="375" y="201" fill="#eefcff" font-size="13" font-weight="750">DOCUMENTED</text><text x="375" y="220" fill="#7f9fb0" font-size="9">development contract</text></g><g><circle cx="600" cy="210" r="48" fill="#071a26" stroke="#8174ff" stroke-width="2"/><text x="600" y="205" fill="#eefcff" font-size="14" font-weight="750">VALIDATED</text><text x="600" y="224" fill="#7f9fb0" font-size="9">behavior + security</text></g><g><circle cx="825" cy="210" r="48" fill="#071a26" stroke="#43d9a3" stroke-width="2"/><text x="825" y="201" fill="#eefcff" font-size="13" font-weight="750">PUBLISHED</text><text x="825" y="220" fill="#7f9fb0" font-size="9">intentional public use</text></g><g><circle cx="1050" cy="210" r="48" fill="#061a28" stroke="#36e4f7" stroke-width="2.5" filter="url(#g)"/><text x="1050" y="201" fill="#eefcff" font-size="13" font-weight="750">VERSIONED</text><text x="1050" y="220" fill="#62dce9" font-size="9">maintained contract</text></g></g><text x="600" y="330" text-anchor="middle" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="10">AUTH • REQUESTS • RESPONSES • ERRORS • RATE LIMITS • WEBHOOKS • VERSIONING</text><rect x="4" y="4" width="1192" height="412" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5"/><rect x="4" y="4" width="1192" height="412" rx="22" fill="none" stroke="#32efff" stroke-width="3" stroke-dasharray="380 1500" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1880" dur="9s" repeatCount="indefinite"/></rect></svg>